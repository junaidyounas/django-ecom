{% extends 'base.html' %} {% load static %} {% block content %}
{% load slippers %}

<!-- Related items section-->
<section class="py-5 bg-light">
    <div class="container px-4 px-lg-5 mt-5">
        <h2 class="fw-bolder mb-4">Related products</h2>
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            {% for f_product in products %}
                <div class="col mb-5">
                    <div style="align-items: center;" class="card h-100 pb-3">
                        <!-- Product image-->
                        <img class="card-img-top" style="height: 200px" src="{{f_product.images.all.first.image.url}}" alt="..." />
                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <!-- Product name-->
                                <h5 class="fw-bolder">{{f_product.name}}</h5>
                                <!-- Product price-->
                                Rs {{f_product.price}}
                            </div>
                        </div> 
                        <a href="/product/{{f_product.slug}}" style="width: 200px;" class="btn btn-outline-primary">Inquiry</a>
                    </div>
                </div>
            {% endfor %}
            
            
        </div>
    </div>
</section>

{% endblock %}
